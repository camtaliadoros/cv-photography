[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # NEXT_PUBLIC_* values are inlined into the client bundle by design, but
  # Netlify's secrets scanner sees them in the build output and fails the
  # deploy. These two are public identifiers, not secrets.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SANITY_PROJECT_ID,NEXT_PUBLIC_SANITY_DATASET,NEXT_PUBLIC_PLAUSIBLE_DOMAIN"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Sanity serves every photograph with a content hash in the URL, so the
# optimised output can be cached indefinitely.
[[headers]]
  for = "/_next/image*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# The old landing page lives on at these paths — the autoresponder links to
# /brochure, so they must keep working after the redesign takes the root.
# (Assets still need copying across from the camvelucci repo before launch.)
